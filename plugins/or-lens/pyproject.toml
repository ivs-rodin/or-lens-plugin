[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "or-lens"
version = "0.2.0"
description = "Deterministic inspection, diagnostics, and solving of LP/MPS optimization models via MCP."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "mcp>=1.30,<2",
  "highspy==1.15.1",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "pydantic>=2.11,<3",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "mypy>=1.15,<3"]

[project.scripts]
or-lens = "server.main:main"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.hatch.build.targets.sdist]
include = [
  "/server", "/tests", "/README.md", "/PLAN.md", "/AGENTS.md",
  "/pyproject.toml", "/uv.lock", "/plugin.json", "/mcp.json",
  "/or-lens-codex-plan.md",
  "/DESIGN.md", "/docs", "/skills", "/ui", "/package.json", "/package-lock.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["highspy.*", "scipy.*"]
ignore_missing_imports = true
